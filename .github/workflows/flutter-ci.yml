name: Flutter Build Verification

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. List files (debug)
        run: ls -la

      - name: 3. Extract all ZIP files
        run: |
          mkdir -p extracted
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "=== Extracting: $f ==="
              unzip -o "$f" -d extracted/ || true
            fi
          done
          echo "=== After extraction ==="
          ls -la extracted/

      - name: 4. Locate the Flutter project
        id: locate
        run: |
          set -e
          PUBSPEC_PATH=$(find . -maxdepth 6 -iname "pubspec.yaml" -not -path "*/build/*" | head -n 1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "::error::لم يُعثر على pubspec.yaml. الملفات داخل ZIP ولم تُفكّ."
            find . -type f -name "*.zip"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "✅ وُجد المشروع في: $PROJECT_DIR"

      - name: 5. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 6. Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 7. Flutter version
        run: flutter --version

      - name: 8. flutter pub get
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: flutter pub get

      - name: 9. build_runner
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: dart run build_runner build --delete-conflicting-outputs
        continue-on-error: true

      - name: 10. flutter analyze
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: 11. flutter test
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: flutter test
        continue-on-error: true

      - name: 12. Regenerate Android files if needed
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -e
          if [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar غير موجود — يُولَّد الآن"
            flutter create --platforms=android .
          else
            echo "✓ gradle-wrapper.jar موجود"
          fi

      - name: 13. flutter build apk --debug
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: flutter build apk --debug

      - name: 14. Verify APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -e
          APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"
          test -f "$APK_PATH"
          echo "✓ APK موجود: $APK_PATH"
          ls -la "$APK_PATH"

      - name: 15. Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: buddy-system-debug-apk
          path: ${{ steps.locate.outputs.project_dir }}/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
