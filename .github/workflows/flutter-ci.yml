name: Flutter Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      
      - name: Extract ZIPs
        run: |
          mkdir -p extracted
          for f in *.zip; do 
            if [ -f "$f" ]; then
              unzip -o "$f" -d extracted/ || true
            fi
          done
          ls -la extracted/
      
      - name: Find Flutter project
        id: find
        run: |
          P=$(find extracted -name "pubspec.yaml" | head -1)
          echo "dir=$(dirname $P)" >> $GITHUB_OUTPUT
          echo "Found: $P"
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      
      - name: pub get
        working-directory: ${{ steps.find.outputs.dir }}
        run: flutter pub get
      
      - name: build_runner
        working-directory: ${{ steps.find.outputs.dir }}
        run: dart run build_runner build --delete-conflicting-outputs
        continue-on-error: true
      
      - name: analyze (non-blocking)
        working-directory: ${{ steps.find.outputs.dir }}
        run: flutter analyze --no-fatal-infos || true
      
      - name: test (non-blocking)
        working-directory: ${{ steps.find.outputs.dir }}
        run: flutter test || true
      
      - name: Remove old android folder
        working-directory: ${{ steps.find.outputs.dir }}
        run: rm -rf android
      
      - name: Regenerate android (preserve lib/)
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          flutter create --platforms=android --org com.buddysystem .
      
      - name: Fix namespace and applicationId
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          FILE="android/app/build.gradle"
          if [ -f "$FILE" ]; then
            sed -i 's/namespace ".*"/namespace "com.buddysystem.buddy_system"/' "$FILE" || true
            sed -i 's/applicationId ".*"/applicationId "com.buddysystem.buddy_system"/' "$FILE" || true
            sed -i 's/minSdkVersion .*/minSdkVersion 23/' "$FILE" || true
            sed -i 's/minSdk .*/minSdk 23/' "$FILE" || true
            sed -i 's/compileSdkVersion .*/compileSdkVersion 34/' "$FILE" || true
            sed -i 's/compileSdk .*/compileSdk 34/' "$FILE" || true
            echo "=== build.gradle after fix ==="
            cat "$FILE"
          fi
      
      - name: Fix gradle.properties
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          PROPS="android/gradle.properties"
          if [ -f "$PROPS" ]; then
            grep -q "android.useAndroidX" "$PROPS" || echo "android.useAndroidX=true" >> "$PROPS"
            grep -q "android.enableJetifier" "$PROPS" || echo "android.enableJetifier=true" >> "$PROPS"
            cat "$PROPS"
          fi
      
      - name: Clean Gradle
        working-directory: ${{ steps.find.outputs.dir }}/android
        run: |
          chmod +x gradlew || true
          ./gradlew clean || true
      
      - name: Build APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: flutter build apk --debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: buddy-system-apk
          path: ${{ steps.find.outputs.dir }}/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
