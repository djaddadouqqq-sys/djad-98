name: Flutter Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      
      - name: Extract ZIPs
        run: |
          mkdir -p extracted
          for f in *.zip; do 
            if [ -f "$f" ]; then
              unzip -o "$f" -d extracted/ || true
            fi
          done
          echo "=== Extracted ==="
          ls -la extracted/
      
      - name: Find Flutter project
        id: find
        run: |
          P=$(find extracted -name "pubspec.yaml" | head -1)
          echo "dir=$(dirname $P)" >> $GITHUB_OUTPUT
          echo "Found: $P"
          ls -la "$(dirname $P)/"
      
      - name: Backup original lib
        run: |
          PROJECT_DIR="${{ steps.find.outputs.dir }}"
          if [ -d "$PROJECT_DIR/lib" ]; then
            cp -r "$PROJECT_DIR/lib" "$PROJECT_DIR/lib_original_backup"
            echo "=== Original lib backed up ==="
            ls -la "$PROJECT_DIR/lib/"
          fi
      
      - name: Override lib with repo root (only if valid)
        run: |
          PROJECT_DIR="${{ steps.find.outputs.dir }}"
          if [ -d "lib" ] && [ -f "lib/main.dart" ]; then
            echo "=== Overriding $PROJECT_DIR/lib with repo root lib/ ==="
            rm -rf "$PROJECT_DIR/lib"
            cp -r lib "$PROJECT_DIR/lib"
            echo "=== New lib/ contents ==="
            ls -la "$PROJECT_DIR/lib/"
            echo "=== All Dart files ==="
            find "$PROJECT_DIR/lib" -type f -name "*.dart"
          else
            echo "=== No valid lib/ in repo root — using ZIP's lib/ ==="
          fi
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      
      - name: Remove workmanager
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          sed -i '/workmanager/d' pubspec.yaml
          echo "=== pubspec.yaml after removal ==="
          grep -v "^#" pubspec.yaml | grep -v "^$" | head -30
      
      - name: pub get
        working-directory: ${{ steps.find.outputs.dir }}
        run: flutter pub get
      
      - name: build_runner
        working-directory: ${{ steps.find.outputs.dir }}
        run: dart run build_runner build --delete-conflicting-outputs
        continue-on-error: true
      
      - name: Remove android
        working-directory: ${{ steps.find.outputs.dir }}
        run: rm -rf android
      
      - name: Regenerate android
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          flutter create --platforms=android --org com.buddysystem .
          echo "=== android/ regenerated ==="
          ls -la android/
      
      - name: Fix build.gradle
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          FILE="android/app/build.gradle"
          if [ -f "$FILE" ]; then
            sed -i 's/namespace ".*"/namespace "com.buddysystem.buddy_system"/' "$FILE" || true
            sed -i 's/applicationId ".*"/applicationId "com.buddysystem.buddy_system"/' "$FILE" || true
            sed -i 's/minSdkVersion .*/minSdkVersion 23/' "$FILE" || true
            sed -i 's/minSdk .*/minSdk 23/' "$FILE" || true
            sed -i 's/compileSdkVersion .*/compileSdkVersion 34/' "$FILE" || true
            sed -i 's/compileSdk .*/compileSdk 34/' "$FILE" || true
            echo "=== build.gradle after fix ==="
            grep -E "namespace|applicationId|minSdk|compileSdk" "$FILE" || true
          fi
          PROPS="android/gradle.properties"
          if [ -f "$PROPS" ]; then
            grep -q "android.useAndroidX" "$PROPS" || echo "android.useAndroidX=true" >> "$PROPS"
            grep -q "android.enableJetifier" "$PROPS" || echo "android.enableJetifier=true" >> "$PROPS"
          fi
      
      - name: Show project structure before build
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          echo "=== lib/ structure ==="
          find lib -type f -name "*.dart" 2>/dev/null | head -20 || echo "No lib/"
          echo "=== pubspec.yaml ==="
          cat pubspec.yaml | head -40
          echo "=== main.dart ==="
          cat lib/main.dart 2>/dev/null | head -30 || echo "No main.dart"
      
      - name: Build APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: flutter build apk --debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: buddy-system-apk
          path: ${{ steps.find.outputs.dir }}/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
