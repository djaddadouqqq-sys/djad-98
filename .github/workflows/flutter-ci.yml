name: Flutter Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      
      - name: Extract ZIPs
        run: |
          mkdir -p extracted
          for f in *.zip; do 
            if [ -f "$f" ]; then
              unzip -o "$f" -d extracted/ || true
            fi
          done
          ls -la extracted/
      
      - name: Find Flutter project
        id: find
        run: |
          P=$(find extracted -name "pubspec.yaml" | head -1)
          echo "dir=$(dirname $P)" >> $GITHUB_OUTPUT
          echo "Found: $P"
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      
      - name: pub get
        working-directory: ${{ steps.find.outputs.dir }}
        run: flutter pub get
      
      - name: build_runner
        working-directory: ${{ steps.find.outputs.dir }}
        run: dart run build_runner build --delete-conflicting-outputs
        continue-on-error: true
      
      - name: analyze (non-blocking)
        working-directory: ${{ steps.find.outputs.dir }}
        run: flutter analyze --no-fatal-infos || true
      
      - name: test (non-blocking)
        working-directory: ${{ steps.find.outputs.dir }}
        run: flutter test || true
      
      - name: Regenerate android (preserve lib/)
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          rm -rf android
          flutter create --platforms=android --org com.buddysystem .
      
      - name: Build APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: flutter build apk --debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: buddy-system-apk
          path: ${{ steps.find.outputs.dir }}/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
