name: Flutter Build Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-extract any .zip archives in the repo root
        run: |
          set -e
          shopt -s nullglob
          for z in *.zip; do
            echo "فكّ ضغط: $z"
            mkdir -p "extracted_$(basename "$z" .zip)"
            unzip -q -o "$z" -d "extracted_$(basename "$z" .zip)"
          done

      - name: Locate the Flutter project (pubspec.yaml)
        id: locate
        run: |
          set -e
          PUBSPEC_PATH=$(find . -maxdepth 6 -iname "pubspec.yaml" -not -path "*/build/*" | head -n 1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "::error::لم يُعثر على pubspec.yaml حتى بعد فكّ ضغط أي ZIP موجود."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "وُجد المشروع في: $PROJECT_DIR"

      - name: Set up Java 17 (required by AGP 8.x)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
          cache: true

      - name: flutter doctor -v
        run: flutter doctor -v

      - name: flutter pub get
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: flutter pub get

      - name: dart run build_runner build --delete-conflicting-outputs
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify Hive generated files actually exist
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -e
          test -f lib/models/daily_checkin.g.dart
          test -f lib/models/anonymous_report.g.dart
          echo "✓ ملفا Hive .g.dart موجودان فعلاً بعد build_runner"

      - name: flutter analyze
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: flutter analyze --no-fatal-infos

      - name: flutter test
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: flutter test

      - name: Backup custom Android app/src files
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -e
          mkdir -p /tmp/android_backup
          cp -r android/app/src /tmp/android_backup/src
          echo "✓ نُسخت android/app/src احتياطياً"

      - name: Regenerate android/ from the real installed Flutter toolchain
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -e
          flutter create --platforms=android --org com.buddysystem --overwrite .
          echo "✓ أُعيد توليد android/ بصيغة Flutter 3.24 الحقيقية"

      - name: Restore custom Android app/src files on top
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -e
          rm -rf android/app/src
          cp -r /tmp/android_backup/src android/app/src
          echo "✓ استُعيدت الملفات المخصَّصة"

      - name: Patch namespace/applicationId/minSdk in the freshly generated app/build.gradle
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -e
          GRADLE_FILE="android/app/build.gradle"
          sed -i -E 's/namespace[[:space:]]*=?[[:space:]]*"[^"]*"/namespace = "com.buddysystem.app"/' "$GRADLE_FILE"
          sed -i -E 's/applicationId[[:space:]]*=?[[:space:]]*"[^"]*"/applicationId = "com.buddysystem.app"/' "$GRADLE_FILE"
          sed -i -E 's/minSdk[[:space:]]*=?[[:space:]]*flutter\.minSdkVersion/minSdk = 23/' "$GRADLE_FILE"
          sed -i -E 's/minSdkVersion[[:space:]]+flutter\.minSdkVersion/minSdkVersion 23/' "$GRADLE_FILE"
          echo "----- android/app/build.gradle بعد التصحيح -----"
          cat "$GRADLE_FILE"

      - name: Ensure MainActivity.kt package matches com.buddysystem.app
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -e
          mkdir -p android/app/src/main/kotlin/com/buddysystem/app
          cat > android/app/src/main/kotlin/com/buddysystem/app/MainActivity.kt << 'EOF'
          package com.buddysystem.app

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity : FlutterActivity()
          EOF
          find android/app/src/main/kotlin -type d -empty -delete || true
          echo "✓ MainActivity.kt مضبوط"

      - name: Make gradlew executable
        working-directory: ${{ steps.locate.outputs.project_dir }}/android
        run: chmod +x gradlew

      - name: ./gradlew :app:assembleDebug
        working-directory: ${{ steps.locate.outputs.project_dir }}/android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: flutter build apk --debug
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: flutter build apk --debug

      - name: Verify APK was actually produced
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -e
          APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"
          test -f "$APK_PATH"
          echo "✓ APK حقيقي موجود: $APK_PATH"
          ls -la "$APK_PATH"

      - name: Upload APK as downloadable artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: buddy-system-debug-apk
          path: ${{ steps.locate.outputs.project_dir }}/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            ${{ steps.locate.outputs.project_dir }}/build/
          retention-days: 7
